[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amnezia-mesh"
version = "0.2.0"
description = "Self-hosted WireGuard mesh with AmneziaWG obfuscation, MagicDNS and Tailscale-style exit/mesh profiles"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
awg-mesh = "awg_mesh.cli:main"

[tool.setuptools]
packages = ["awg_mesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
